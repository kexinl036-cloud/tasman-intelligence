[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/policy-news"
  to = "/.netlify/functions/policy-news"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Cache-Control = "public, max-age=600"

[[redirects]]
  from = "/api/research-data"
  to = "/.netlify/functions/research-data"
  status = 200
