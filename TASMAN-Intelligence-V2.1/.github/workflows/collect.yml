name: TASMAN verified ingestion
on:
  schedule:
    # GitHub cron is UTC. Daily after the ECB business-day reference rate is published.
    - cron: '23 18 * * *'
    # Official central-bank headline checks (not policy-rate extraction).
    - cron: '17 1,7,13 * * *'
    # Optional licensed housing feed, weekly.
    - cron: '31 20 * * 1'
  workflow_dispatch:
    inputs:
      data_job:
        description: 'Select task (fx-backfill first; use housing only with authorized feed)'
        type: choice
        required: true
        default: fx-backfill
        options: [fx, fx-backfill, news, housing]
permissions:
  contents: read
concurrency:
  group: tasman-etl
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HOUSING_FEED_URL: ${{ secrets.HOUSING_FEED_URL }}
      HOUSING_FEED_HOST: ${{ secrets.HOUSING_FEED_HOST }}
      HOUSING_FEED_AUTHORIZED: ${{ secrets.HOUSING_FEED_AUTHORIZED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Choose ingest task
        id: choose
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_JOB: ${{ inputs.data_job }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then job="$INPUT_JOB"
          elif [[ "$CRON" == '23 18 * * *' ]]; then job='fx'
          elif [[ "$CRON" == '31 20 * * 1' ]]; then job='housing'
          else job='news'; fi
          echo "job=$job" >> "$GITHUB_OUTPUT"
      - name: Collect and persist new versions
        if: steps.choose.outputs.job != 'housing' || env.HOUSING_FEED_AUTHORIZED == 'true'
        run: python backend/ingest.py '${{ steps.choose.outputs.job }}'
      - name: Skip unconfigured housing feed
        if: steps.choose.outputs.job == 'housing' && env.HOUSING_FEED_AUTHORIZED != 'true'
        run: echo 'Licensed housing feed not configured; no unauthorized scraping attempted.'
